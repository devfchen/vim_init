# 前缀键改为 Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# 鼠标滚动（可在单个 pane 内独立滚动）
set -g mouse on

# focus-events: needed by vim/nvim/Claude Code
set -g focus-events on

# 滚轮：自动聚焦鼠标所在 pane，并进入 copy-mode 向上/下翻
# 修复左右分屏时只能滚当前 focused pane 的问题
bind -n WheelUpPane if-shell -F -t = "#{?pane_in_mode,1,#{alternate_on}}" \
    "send-keys -M" "select-pane -t=; copy-mode -e; send-keys -M"
bind -n WheelDownPane if-shell -F -t = "#{?pane_in_mode,1,#{alternate_on}}" \
    "send-keys -M" "select-pane -t=; send-keys -M"

# 鼠标选中自动复制：绑定在文件末尾（要放在 TPM 之后才能覆盖 tmux-yank）

# 启用 OSC52：tmux 把复制内容通过 escape sequence 推到外层终端的剪贴板
# PuTTY 0.78+、iTerm2、Windows Terminal、WezTerm 都支持
set -g set-clipboard on

# 窗口和面板编号从1开始
set -g base-index 1
setw -g pane-base-index 1

# 分屏快捷键（vim 风格，保持当前目录）
bind s split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# 关闭面板（带确认）
bind x confirm-before -p "kill-pane #P? (y/n)" kill-pane

# Alt+方向键切换面板（免前缀）
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# 快速重载配置
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# 增大历史回滚行数
set -g history-limit 50000

# 减少 Escape 延迟
set -sg escape-time 0

# 光标：强制稳定块，不闪
# iTerm2 profile 里的 "Blinking Cursor" 已经是 0，但那只管终端自己的默认值——
# 应用（Claude Code 等 TUI）会发 DECSCUSR (CSI Ps SP q) 主动要求闪烁光标，
# 把 profile 设置盖掉。tmux 3.3+ 的 cursor-style 优先级更高，能拦下这个请求。
# 取值：default / block / bar / underline，以及对应的 blinking-* 版本。
# 想要竖线就把 block 改成 bar。
set -g cursor-style block

# ============ TPM 插件 ============
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'       # 合理默认值
set -g @plugin 'tmux-plugins/tmux-resurrect'      # 手动保存/恢复会话（prefix+Ctrl-s / prefix+Ctrl-r）
set -g @plugin 'tmux-plugins/tmux-continuum'      # 自动每 15 分钟保存，启动时自动恢复
set -g @plugin 'tmux-plugins/tmux-yank'           # 复制到系统剪贴板
# 复制后留在 copy-mode、保留选区，不跳回底部（默认 copy-pipe-and-cancel 会退出 copy-mode）
set -g @yank_action 'copy-pipe-no-clear'
set -g @plugin 'alexwforsythe/tmux-which-key'     # prefix+Space 弹出快捷键菜单（zellij-like）
set -g @tmux-which-key-xdg-enable 1               # 用 ~/.config/tmux/plugins/tmux-which-key/config.yaml

# resurrect: 连 pane 内容也一起存
set -g @resurrect-capture-pane-contents 'on'
# continuum: 启动 tmux 自动恢复
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# TPM 初始化（必须放在配置最后）
run '~/.tmux/plugins/tpm/tpm'

# ============ 鼠标选中体验对齐 iTerm2（放在 TPM 之后，覆盖插件的绑定）============
# 往上翻历史后选中/双击/三击：只复制，不退出 copy-mode，所以不会跳回最底部。
# 复制完接 stop-selection：选区定住，不再跟着光标走——否则滚轮一翻，光标随内容移动，选区末端就被拖着变了（iTerm2 里滚动不改选区）。
# 单击取消选区（在历史里不跳底部，见文件末尾 MouseUp1Pane）；滚轮滚回底部会自动退出 copy-mode（WheelUpPane 里用的是 copy-mode -e），或按 q / Esc 退出。
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "pbcopy" \; send-keys -X stop-selection
# 双击绑在 SecondClick 上：DoubleClick 要等约 300ms 确认不是三击才触发，会慢一拍；
# SecondClick 在第二下按下时立即触发，三击时 TripleClick 照样随后到来覆盖为整行。
bind -T copy-mode-vi SecondClick1Pane select-pane \; send-keys -X select-word \; send-keys -X copy-pipe-no-clear "pbcopy" \; send-keys -X stop-selection
unbind -T copy-mode-vi DoubleClick1Pane
bind -n SecondClick1Pane select-pane -t = \; if -F "#{pane_in_mode}" { send-keys -M } { if -F "#{mouse_any_flag}" {} { copy-mode -H ; send-keys -X select-word ; run-shell -d 0.3 ; send-keys -X copy-pipe-and-cancel "pbcopy" } }
# 程序自己处理鼠标时（vim、Claude Code 等）仍按默认把双击转给它
bind -n DoubleClick1Pane if -F "#{&&:#{mouse_any_flag},#{!:#{pane_in_mode}}}" { send-keys -M }
bind -T copy-mode-vi TripleClick1Pane select-pane \; send-keys -X select-line \; send-keys -X copy-pipe-no-clear "pbcopy" \; send-keys -X stop-selection
bind -T copy-mode-vi MouseDown1Pane select-pane \; send-keys -X clear-selection

# 双击选词与 iTerm2 一致：/-+\~_. 算单词的一部分，中文标点算分隔符（整段中文连着选，遇到标点/空格才断）
set -g word-separators " !\"#\$%&'()*,:;<=>?@[]^`{|}，。、；：？！“”‘’（）【】《》〈〉「」『』…—·～￥"

# 选区颜色与 iTerm2 当前 profile 一致（Selection Color #b3d7ff / Selected Text Color #000000）
set -g mode-style "bg=#b3d7ff,fg=#000000"

# copy-mode 里的光标"隐身"：方块光标会盖住所在那个字，看不出它有没有被选中（vi 模式下其实是选中的）。
# tmux 没有"copy-mode 隐藏光标"的选项，只能进 copy-mode 时把光标改成细竖线、颜色同选区背景，
# 这样只靠背景色判断选没选中，跟 iTerm2 一致；退出 copy-mode 时清掉 pane 级设置，回到上面全局的 block。
set-hook -g 'pane-mode-changed[10]' 'if -F "#{pane_in_mode}" { set -p cursor-style bar ; set -p cursor-colour "#b3d7ff" } { set -pu cursor-style ; set -pu cursor-colour }'

# 退出 copy-mode（2026-10-06）：vi 模式下 Esc 和单击默认只清选区、不退出，
# 结果选中复制后点输入框 / 按 Esc 都还卡在 copy-mode，Cmd+V 被当成 copy-mode 按键，粘贴不进去。
# 单击（没拖动）按位置分：
#   翻在历史里（scroll_position > 0）→ 只取消选区、原地不动，跟 iTerm2 一样（选错了可以接着往上翻重选，不会被甩回底部）；
#   本来就在底部 → 直接退出 copy-mode，回去打字（不会有跳动）。
# 拖动结束走 MouseDragEnd1Pane，不受影响；选区在 MouseDown1Pane 时已清掉。
bind -T copy-mode-vi MouseUp1Pane if -F "#{scroll_position}" { send-keys -X clear-selection } { send-keys -X cancel }
# Esc：有选区先清选区，再按一次退出
bind -T copy-mode-vi Escape if -F "#{selection_present}" { send-keys -X clear-selection } { send-keys -X cancel }
